<!doctype html>
<html lang="en">
    <head>
        <title>Login to Guild Wars 2</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">

        <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet" integrity="sha256-YLGeXaapI0/5IgZopewRJcFXomhRMlYYjugPLSyNjTY=" crossorigin="anonymous">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha256-eZrrJcwDc/3uDhsdt61sL2oOBY362qM3lon1gyExkL0=" crossorigin="anonymous">
        <style>
            html, body {
                height: 100%;
            }

            form.in-the-middle {
                min-height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 12px 0;
            }

            form.in-the-middle > .card {
                margin: 0 auto;
                max-width: 700px;
                width: calc(100% - 24px);
            }
        </style>
    </head>
    <body>
        <form class="in-the-middle" action="/login" method="POST" role="form">
            <div class="card">
                <h4 class="card-header"><i class="fa fa-user-circle"></i> Login to Guild Wars 2</h4>
                <div class="card-body">
                    <p>
                        Please enter your API key which you can create at <a href="https://account.arena.net/applications" target="_blank">account.arena.net/applications</a>.
                    </p>
                    <p class="small">
                        <strong>Required permissions:</strong> account, progression
                    </p>

                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <label class="input-group-text" for="apikey">API key</label>
                        </div>
                        <input class="form-control" name="apikey" id="apikey" autocomplete="off" spellcheck="false" required placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXXXXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX">
                    </div>

                    <button type="submit" class="btn btn-success">Login</button>
                </div>
            </div>
        </form>
    </body>
</html>
