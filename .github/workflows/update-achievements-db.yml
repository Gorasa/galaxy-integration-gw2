name: Update achievements DB

on:
  schedule:
    # monthly, on the 1st at 04:17 UTC
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Regenerate gw2/db/achievements.json
        run: python tools/update_achievements_db.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-achievements-db
          delete-branch: true
          add-paths: gw2/db/achievements.json
          commit-message: Update achievements DB
          title: Update achievements DB
          body: |
            Regenerated `gw2/db/achievements.json` from the Guild Wars 2 API with `tools/update_achievements_db.py`.

            Created by the `Update achievements DB` workflow.
